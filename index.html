    <script>
        // Apply the theme before first paint to avoid a flash of the wrong mode,
        // and keep the browser-UI theme-color in sync with the actual theme.
        window.applyTheme = function (theme) {
            document.documentElement.dataset.theme = theme;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = theme === 'dark' ? '#151515' : '#E5E4E2';
        };
        (function () {
            // Dark unless the visitor has picked light with the toggle.
            var theme = 'dark';
            try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
            window.applyTheme(theme);
        })();
    </script>
