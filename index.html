    <script>
        // Apply the theme before first paint to avoid a flash of the wrong mode,
        // and keep the browser-UI theme-color in sync with the actual theme.
        window.applyTheme = function (theme) {
            document.documentElement.dataset.theme = theme;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = theme === 'dark' ? '#151515' : '#E5E4E2';
        };
        (function () {
            var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            var theme = system;
            try { theme = localStorage.getItem('theme') || system; } catch (e) {}
            window.applyTheme(theme);
        })();
    </script>
